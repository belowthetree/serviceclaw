<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
        padding: 20px;
      }
      .dashboard {
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        color: #333;
        margin-bottom: 20px;
        font-size: 28px;
      }
      .widgets {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
      }
      .widget {
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .widget h2 {
        font-size: 16px;
        color: #666;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .widget-content {
        font-size: 24px;
        color: #333;
        font-weight: 600;
      }
      .loading {
        color: #999;
        font-style: italic;
      }
      .last-updated {
        text-align: center;
        margin-top: 30px;
        color: #999;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="dashboard">
      <h1>📊 Data Dashboard</h1>
      <div class="widgets">
        <div class="widget" id="clock-widget">
          <h2>Current Time</h2>
          <div class="widget-content loading">Loading...</div>
        </div>
        <div class="widget" id="weather-widget">
          <h2>Weather</h2>
          <div class="widget-content loading">Loading...</div>
        </div>
        <div class="widget" id="tasks-widget">
          <h2>Tasks</h2>
          <div class="widget-content loading">Loading...</div>
        </div>
      </div>
      <div class="last-updated">Last updated: <span id="last-update">-</span></div>
    </div>

    <script>
      // Widget data fetchers
      const widgets = {
        clock: () => {
          const now = new Date();
          return now.toLocaleString();
        },
        weather: async () => {
          try {
            const resp = await fetch("/api/services/data-dashboard/weather");
            const data = await resp.json();
            return data.temperature
              ? `${data.temperature}°C - ${data.condition}`
              : "Weather data unavailable";
          } catch (e) {
            return "Unable to fetch weather";
          }
        },
        tasks: async () => {
          try {
            const resp = await fetch("/api/services/data-dashboard/tasks");
            const data = await resp.json();
            return data.count !== undefined ? `${data.count} pending tasks` : "No task data";
          } catch (e) {
            return "Unable to fetch tasks";
          }
        },
      };

      // Update all widgets
      async function updateWidgets() {
        document.getElementById("clock-widget").querySelector(".widget-content").textContent =
          widgets.clock();

        const weather = await widgets.weather();
        document.getElementById("weather-widget").querySelector(".widget-content").textContent =
          weather;

        const tasks = await widgets.tasks();
        document.getElementById("tasks-widget").querySelector(".widget-content").textContent =
          tasks;

        document.getElementById("last-update").textContent = new Date().toLocaleString();
      }

      // Initial load and auto-refresh
      updateWidgets();
      setInterval(updateWidgets, 60000); // Refresh every 60 seconds
    </script>
  </body>
</html>
